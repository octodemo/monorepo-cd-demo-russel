apiVersion: v1
kind: Namespace
metadata:
  name: monorepo
  labels:
    name: monorepo
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monorepo-ingress
  namespace: monorepo
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - monorepo-demo.example.com
    secretName: monorepo-tls
  rules:
  - host: monorepo-demo.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: react-app-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: node-api-service
            port:
              number: 4000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: monorepo
data:
  nginx.conf: |
    upstream backend {
        server node-api-service:4000;
    }
    
    server {
        listen 80;
        server_name localhost;
        
        location / {
            proxy_pass http://react-app-service:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /api {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        location /health {
            proxy_pass http://backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }